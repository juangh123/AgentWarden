name: Feature request
description: Propose a focused improvement to AgentWarden.
title: '[Feature]: '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or security gap should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the expected CLI, Action, configuration, or SDK behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What existing commands, policies, or external tools were considered?
    validations:
      required: false
  - type: textarea
    id: security
    attributes:
      label: Security and compatibility impact
      description: Note changes to rule behavior, defaults, lockfiles, provenance, exit codes, or package output.
    validations:
      required: true
