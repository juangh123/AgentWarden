name: Cold Start Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '41 2 * * 1'

permissions:
  contents: read

concurrency:
  group: cold-start-benchmark
  cancel-in-progress: false

jobs:
  publish-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Measure local and published-package startup
        env:
          NO_COLOR: '1'
        shell: bash
        run: |
          set -o pipefail
          node scripts/cold-start-benchmark.mjs \
            --network \
            --network-runs=3 \
            --json | tee cold-start-benchmark.json
      - name: Preserve benchmark report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cold-start-benchmark
          path: cold-start-benchmark.json
          if-no-files-found: warn
