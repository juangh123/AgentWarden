name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm run test:package
      - run: npm run test:mvp
      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agentwarden-release
          path: |
            release/*.tgz
            release/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Install trusted publishing CLI
        run: |
          npm install --global npm@^11.5.1
          node --version
          npm --version
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
      - name: Download verified release artifacts
        uses: actions/download-artifact@v8
        with:
          name: agentwarden-release
          path: release
      - name: Verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
      - name: Publish to npm with trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TARBALL="release/agentwarden-cli-${PACKAGE_VERSION}.tgz"
          test -f "${TARBALL}"
          npm publish "${TARBALL}" --access public --provenance --ignore-scripts
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          ASSETS=("release/agentwarden-cli-${PACKAGE_VERSION}.tgz" release/SHA256SUMS)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
            echo "Updated release assets for GitHub Release ${GITHUB_REF_NAME}."
          else
            NOTES_FILE="docs/release-notes-${GITHUB_REF_NAME}.md"
            if [[ -f "${NOTES_FILE}" ]]; then
              gh release create "${GITHUB_REF_NAME}" --verify-tag --notes-file "${NOTES_FILE}" --title "AgentWarden ${GITHUB_REF_NAME}" "${ASSETS[@]}"
            else
              gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "AgentWarden ${GITHUB_REF_NAME}" "${ASSETS[@]}"
            fi
          fi
      - name: Update floating major tag
        shell: bash
        run: |
          set -euo pipefail
          MAJOR_TAG="${GITHUB_REF_NAME%%.*}"
          git tag -f "${MAJOR_TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${MAJOR_TAG}" --force
