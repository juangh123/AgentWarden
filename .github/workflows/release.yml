name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    # Least privilege: verification only needs to read the repository. OIDC and
    # write access belong to the publish job alone.
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to commit SHAs; the trailing comment
      # records which release tag each SHA was resolved from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke
      - run: npm run test:package
      # Release publishes the committed tarball, so verify those exact bytes
      # instead of repacking a fresh artifact on the runner.
      - run: npm run test:release
      - name: Preserve verified release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agentwarden-release
          path: |
            release/*.tgz
            release/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Do not leave the workflow token in .git/config: later steps run
          # third-party installs (npm) that must not be able to read it.
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Install trusted publishing CLI
        run: |
          npm install --global npm@11.5.1
          node --version
          npm --version
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "v${PACKAGE_VERSION}"
      - name: Download verified release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: agentwarden-release
          path: release
      - name: Verify release checksum
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS
      - name: Publish to npm with trusted publishing
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TARBALL="release/agentwarden-cli-${PACKAGE_VERSION}.tgz"
          test -f "${TARBALL}"
          npm publish "./${TARBALL}" --access public --provenance --ignore-scripts
      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          ASSETS=("release/agentwarden-cli-${PACKAGE_VERSION}.tgz" release/SHA256SUMS)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSETS[@]}" --clobber
            echo "Updated release assets for GitHub Release ${GITHUB_REF_NAME}."
          else
            NOTES_FILE="docs/release-notes-${GITHUB_REF_NAME}.md"
            if [[ -f "${NOTES_FILE}" ]]; then
              gh release create "${GITHUB_REF_NAME}" --verify-tag --notes-file "${NOTES_FILE}" --title "AgentWarden ${GITHUB_REF_NAME}" "${ASSETS[@]}"
            else
              gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes --title "AgentWarden ${GITHUB_REF_NAME}" "${ASSETS[@]}"
            fi
          fi
      - name: Update floating minor tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A 0.x project must not advertise a floating `v0` tag: every minor
          # release may contain breaking changes. Float the minor series only.
          MINOR_TAG="${GITHUB_REF_NAME%.*}"
          git tag -f "${MINOR_TAG}" "${GITHUB_SHA}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/${MINOR_TAG}" --force
