name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run Action on Node 22
        uses: ./
        with:
          node-version: '22'
          path: '.'
          config: 'fixtures/ci-policy.json'
          baseline: 'fixtures/empty-baseline.json'
          baseline-status: 'true'
          baseline-fail-on-unmatched: 'true'
          changed: 'true'
      - name: Run policy guard on Node 22
        uses: ./
        with:
          node-version: '22'
          path: '.'
          config: 'fixtures/ci-policy.json'
          changed: 'true'
          policy-guard: 'true'
          policy-guard-base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - name: Run Action on Node 24
        uses: ./
        with:
          node-version: '24'
          path: '.'
          config: 'fixtures/ci-policy.json'
          baseline: 'fixtures/empty-baseline.json'
          baseline-status: 'true'
          baseline-fail-on-unmatched: 'true'
          changed: 'true'
      - name: Run Action against integration example
        uses: ./
        with:
          node-version: '22'
          path: 'examples/github-action-project'
          profile: strict
          config: 'examples/github-action-project/.agentwarden/policy.json'
          sarif: 'integration-example.sarif'
      - name: Run published Action against integration example
        uses: juangh123/AgentWarden@v0.3.3
        with:
          node-version: '22'
          path: 'examples/github-action-project'
          profile: strict
          config: 'examples/github-action-project/.agentwarden/policy.json'
          sarif: 'published-integration-example.sarif'

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:package

  mvp-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mvp

  git-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:git-install
