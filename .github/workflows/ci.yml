name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Least privilege: every job here only reads the repository. Third-party
# actions are pinned to commit SHAs, with the source tag in a trailing comment.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - if: matrix.node == 24
        run: npm audit --audit-level=high
      - if: matrix.node == 24
        run: npm audit signatures
      - run: npm run typecheck
      - run: npm test
      - run: npm run smoke

  min-node:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.6.0
          cache: npm
      - run: npm ci
      - run: npm run smoke

  action-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Run Action on Node 22
        uses: ./
        with:
          node-version: '22'
          path: '.'
          config: 'fixtures/ci-policy.json'
          baseline: 'fixtures/empty-baseline.json'
          baseline-status: 'true'
          baseline-fail-on-unmatched: 'true'
          changed: 'true'
      - name: Run policy guard on Node 22
        uses: ./
        with:
          node-version: '22'
          path: '.'
          config: 'fixtures/ci-policy.json'
          profile: strict
          min-score: '95'
          changed: 'true'
          policy-guard: 'true'
          policy-guard-base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - name: Verify workflow-level overrides are guarded
        id: guard-override
        continue-on-error: true
        uses: ./
        with:
          node-version: '22'
          path: '.'
          config: 'fixtures/ci-policy.json'
          profile: strict
          min-score: '95'
          ignore-rules: SEC-CRED-001
          policy-guard: 'true'
          policy-guard-base: ${{ github.event.pull_request.base.sha || 'origin/main' }}
      - name: Require workflow-level override to fail
        if: steps.guard-override.outcome != 'failure'
        run: exit 1
      - name: Run Action on Node 24
        uses: ./
        with:
          node-version: '24'
          path: '.'
          config: 'fixtures/ci-policy.json'
          baseline: 'fixtures/empty-baseline.json'
          baseline-status: 'true'
          baseline-fail-on-unmatched: 'true'
          changed: 'true'
      - name: Run Action against integration example
        uses: ./
        with:
          node-version: '22'
          path: 'examples/github-action-project'
          profile: strict
          config: 'examples/github-action-project/.agentwarden/policy.json'
          sarif: 'integration-example.sarif'
      - name: Run published Action against integration example
        uses: juangh123/AgentWarden@v0.3.6
        with:
          node-version: '22'
          path: 'examples/github-action-project'
          profile: strict
          config: 'examples/github-action-project/.agentwarden/policy.json'
          sarif: 'published-integration-example.sarif'

  package-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:package

  mvp-packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mvp

  git-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:git-install
