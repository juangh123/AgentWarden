name: AgentWarden Security Gate

description: 'Scan and gate AI Agent skills and MCP configurations against prompt injections and supply chain risks'
author: 'juangh123'

inputs:
  node-version:
    description: 'Node.js version used to build and run AgentWarden'
    required: false
    default: '22'
  path:
    description: 'Path to a skill, MCP config, or directory to scan'
    required: false
    default: '.'
  config:
    description: 'Optional explicit JSON configuration file'
    required: false
    default: ''
  profile:
    description: 'Policy profile: legacy, balanced, or strict'
    required: false
    default: 'balanced'
  fail-on:
    description: 'Optional failure severity override: critical, high, medium, low, info'
    required: false
    default: ''
  min-score:
    description: 'Optional minimum security score override (0-100)'
    required: false
    default: ''
  include:
    description: 'Optional newline-separated globs that limit directory discovery'
    required: false
    default: ''
  exclude:
    description: 'Optional newline-separated globs excluded from directory discovery'
    required: false
    default: ''
  ignore-rules:
    description: 'Optional newline-separated rule IDs to ignore'
    required: false
    default: ''
  severity-overrides:
    description: 'Optional newline-separated RULE_ID=severity overrides'
    required: false
    default: ''
  baseline:
    description: 'Optional baseline file containing reviewed findings to suppress'
    required: false
    default: ''
  sarif:
    description: 'Path to write SARIF output report for GitHub Security Tab'
    required: false
    default: 'agentwarden-results.sarif'

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Build AgentWarden
      shell: bash
      run: |
        set -euo pipefail
        cd "$GITHUB_ACTION_PATH"
        npm ci --ignore-scripts
        npm run build
    - name: Run AgentWarden Scanner
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_PROFILE: ${{ inputs.profile }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_MIN_SCORE: ${{ inputs.min-score }}
        INPUT_INCLUDE: ${{ inputs.include }}
        INPUT_EXCLUDE: ${{ inputs.exclude }}
        INPUT_IGNORE_RULES: ${{ inputs.ignore-rules }}
        INPUT_SEVERITY_OVERRIDES: ${{ inputs.severity-overrides }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_SARIF: ${{ inputs.sarif }}
      run: |
        set -euo pipefail
        args=(scan "$INPUT_PATH" --sarif)
        if [[ -n "$INPUT_CONFIG" ]]; then
          args+=(--config "$INPUT_CONFIG")
        fi
        append_lines() {
          local option="$1"
          local value="$2"
          while IFS= read -r line; do
            line="${line%$'\r'}"
            if [[ -n "$line" ]]; then
              args+=("$option" "$line")
            fi
          done <<< "$value"
        }
        if [[ -n "$INPUT_PROFILE" ]]; then
          args+=(--profile "$INPUT_PROFILE")
        fi
        if [[ -n "$INPUT_FAIL_ON" ]]; then
          args+=(--fail-on "$INPUT_FAIL_ON")
        fi
        if [[ -n "$INPUT_MIN_SCORE" ]]; then
          args+=(--min-score "$INPUT_MIN_SCORE")
        fi
        append_lines --include "$INPUT_INCLUDE"
        append_lines --exclude "$INPUT_EXCLUDE"
        append_lines --ignore-rule "$INPUT_IGNORE_RULES"
        append_lines --severity-override "$INPUT_SEVERITY_OVERRIDES"
        if [[ -n "$INPUT_BASELINE" ]]; then
          args+=(--baseline "$INPUT_BASELINE")
        fi
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}" > "$INPUT_SARIF"
