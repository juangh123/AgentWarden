name: Agent Skill Security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  agentwarden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan changed agent assets
        uses: juangh123/AgentWarden@v0.3.3
        with:
          path: .
          profile: strict
          config: examples/policy.json
          changed-from: ${{ github.event.pull_request.base.sha || github.event.before }}
          sarif: agentwarden.sarif

      - name: Upload SARIF
        if: always() && hashFiles('agentwarden.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: agentwarden.sarif
